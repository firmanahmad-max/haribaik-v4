<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>HariBaik — Mulai harimu dengan kebaikan</title>
  <meta name="description" content="PWA motivasi harian Islami dengan AI companion. Curhat, pilih mood, dan dapatkan empati, ayat/hadits, saran aksi, dan doa." />
  <meta name="theme-color" content="#0c1a13" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <div class="brand">
          <div class="logo">H</div>
          <div>
            <h1>HariBaik</h1>
            <div class="tagline">Mulai harimu dengan kebaikan</div>
          </div>
        </div>
        <nav class="tabs">
          <a href="index.html" class="active">Chat</a>
          <a href="favorites.html">Favorit</a>
        </nav>
        <div class="header-actions">
          <button class="icon-btn" id="notifyBtn" title="Pengingat harian" aria-label="Pengingat harian">🔔</button>
          <button class="icon-btn" id="themeBtn" title="Ganti tema" aria-label="Ganti tema">🌙</button>
        </div>
      </div>
      <div class="context-bar">
        <span class="chip" id="ctxWaktu">🌤️ —</span>
        <span class="chip" id="ctxHijri">🌙 —</span>
        <span class="chip streak" id="ctxStreak">🔥 0 hari</span>
      </div>
    </header>

    <main class="chat" id="chat" aria-live="polite"></main>

    <div class="mood-selector" id="moodSelector" aria-label="Pilih mood">
      <!-- mood pills diisi oleh app.js -->
    </div>

    <footer class="composer">
      <div class="input-row">
        <button class="voice-btn" id="voiceBtn" title="Input suara" aria-label="Input suara">🎤</button>
        <textarea id="input" rows="1" placeholder="Ceritakan apa yang kamu rasakan…" aria-label="Pesan"></textarea>
        <button class="send-btn" id="sendBtn" title="Kirim" aria-label="Kirim">➤</button>
      </div>
      <div class="powered">Powered by Max Computer - Arta Ecosystem</div>
    </footer>
  </div>

  <div class="toast" id="toast" role="status"></div>

  <!-- Kontainer share card (di-render off-screen, ditangkap html2canvas) -->
  <div id="shareCardMount"></div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
