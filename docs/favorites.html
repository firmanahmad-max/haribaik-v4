<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://syiqxvnsvvzmhcumyzed.supabase.co wss://syiqxvnsvvzmhcumyzed.supabase.co https://haribaik-v4-production.up.railway.app https://api.aladhan.com https://api.bigdatacloud.net; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Favorit — HariBaik</title>
  <meta name="description" content="Kumpulan ayat, hadits, dan doa favoritmu di HariBaik." />
  <meta name="theme-color" content="#0c1a13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HariBaik" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <div class="brand">
          <div class="logo">H</div>
          <div>
            <h1>Favorit</h1>
            <div class="tagline" id="favTagline">Kutipan yang kamu simpan</div>
          </div>
        </div>
        <nav class="tabs">
          <a href="index.html" data-i18n="nav_chat">Chat</a>
          <a href="journal.html" data-i18n="nav_journal">Jurnal</a>
          <a href="amalan.html" data-i18n="nav_deeds">Amalan</a>
          <a href="doa.html" data-i18n="nav_doa">Doa</a>
          <a href="favorites.html" class="active" data-i18n="nav_favorites">Favorit</a>
        </nav>
        <div class="header-actions">
          <div class="presence" id="presence" hidden aria-live="polite" title="Pengguna online sekarang">
            <span class="presence-dot"></span><b id="presenceN">0</b><span class="presence-label" data-i18n="online">online</span>
          </div>
          <button class="icon-btn" id="themeBtn" title="Ganti tema" aria-label="Ganti tema">🌙</button>
        </div>
      </div>
    </header>

    <div class="fav-page">
      <div class="fav-toolbar">
        <button class="mini-btn" id="favExport" title="Ekspor favorit ke file" data-i18n="fav_export">⬇️ Export</button>
        <button class="mini-btn" id="favImport" title="Impor favorit dari file" data-i18n="fav_import">⬆️ Import</button>
        <input type="file" id="favFile" accept="application/json" hidden />
      </div>
      <div class="fav-filters">
        <button class="chip-btn selected" data-filter="all" data-i18n="fav_all">Semua</button>
        <button class="chip-btn" data-filter="quran" data-i18n="label_quran">Al-Quran</button>
        <button class="chip-btn" data-filter="hadits" data-i18n="label_hadits">Hadits</button>
        <button class="chip-btn" data-filter="doa" data-i18n="label_doa">Doa</button>
      </div>
      <div class="fav-grid" id="favGrid"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div id="shareCardMount"></div>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script type="module" src="js/errlog.js"></script>
  <script type="module" src="js/install.js"></script>
  <script type="module" src="js/favorites.js"></script>
</body>
</html>
