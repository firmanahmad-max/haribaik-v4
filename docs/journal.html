<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Jurnal & Statistik — HariBaik</title>
  <meta name="description" content="Jurnal mood & statistik harian — catat perasaanmu dan dapatkan insight mingguan dari AI." />
  <meta name="theme-color" content="#0c1a13" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="HariBaik" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-row">
        <div class="brand">
          <div class="logo">H</div>
          <div>
            <h1>Jurnal</h1>
            <div class="tagline" data-i18n="tagline_journal">Pantau perjalanan hatimu</div>
          </div>
        </div>
        <nav class="tabs">
          <a href="index.html" data-i18n="nav_chat">Chat</a>
          <a href="journal.html" class="active" data-i18n="nav_journal">Jurnal</a>
          <a href="amalan.html" data-i18n="nav_deeds">Amalan</a>
          <a href="doa.html" data-i18n="nav_doa">Doa</a>
          <a href="favorites.html" data-i18n="nav_favorites">Favorit</a>
        </nav>
        <div class="header-actions">
          <button class="icon-btn" id="themeBtn" title="Ganti tema" aria-label="Ganti tema">🌙</button>
        </div>
      </div>
    </header>

    <div class="journal-page">
      <!-- Catat mood -->
      <section class="card jcard">
        <h2 class="jtitle" data-i18n="j_how">Bagaimana perasaanmu?</h2>
        <div class="mood-selector inline" id="jMoodSelector"></div>
        <textarea id="jNote" rows="2" placeholder="Tulis catatan singkat (opsional)…" data-i18n-ph="j_note_ph" aria-label="Catatan"></textarea>
        <button class="primary-btn" id="jSave" data-i18n="j_save">Simpan ke jurnal</button>
      </section>

      <!-- Insight AI mingguan -->
      <section class="card jcard">
        <div class="jhead">
          <h2 class="jtitle" data-i18n="j_insight">Insight mingguan</h2>
          <button class="mini-btn" id="jInsightBtn" data-i18n="j_make_insight">✨ Buat insight</button>
        </div>
        <div id="jInsight" class="jinsight-empty" data-i18n="j_insight_empty">Catat mood beberapa hari, lalu buat refleksi mingguan dari AI di sini.</div>
        <div id="jInsightHistory" class="jhistory"></div>
      </section>

      <!-- Statistik -->
      <section class="card jcard">
        <div class="jhead">
          <h2 class="jtitle" data-i18n="j_stats">Statistik</h2>
          <div class="jperiod" id="jPeriod" role="tablist" aria-label="Periode statistik">
            <button class="chip-btn selected" data-period="week" data-i18n="j_period_week">Minggu ini</button>
            <button class="chip-btn" data-period="month" data-i18n="j_period_month">Bulan ini</button>
            <button class="chip-btn" data-period="all" data-i18n="j_period_all">Semua</button>
          </div>
        </div>
        <div class="jstats-top" id="jStatsTop"></div>
        <div class="jcompare" id="jCompare"></div>
        <h3 class="jsub" data-i18n="j_month_trend">Tren bulan ini</h3>
        <div id="jMonthTrend" class="jmonthtrend"></div>
        <h3 class="jsub" data-i18n="j_dist">Sebaran mood</h3>
        <div id="jDist" class="jdist" role="img" aria-label="Diagram sebaran mood"></div>
        <h3 class="jsub" data-i18n="j_last7">7 hari terakhir</h3>
        <div id="jTrend" class="jtrend"></div>
        <div class="jlegend" id="jLegend"></div>
      </section>

      <!-- Kalender -->
      <section class="card jcard">
        <div class="jhead">
          <button class="mini-btn" id="jPrev" aria-label="Bulan sebelumnya">‹</button>
          <h2 class="jtitle" id="jMonthLabel">—</h2>
          <button class="mini-btn" id="jNext" aria-label="Bulan berikutnya">›</button>
        </div>
        <div class="jcal-grid jcal-head" id="jCalHead"></div>
        <div class="jcal-grid" id="jCalBody"></div>
        <p class="jcal-hint" data-i18n="j_cal_hint">Ketuk tanggal untuk melihat catatanmu.</p>
      </section>

      <!-- Cadangan jurnal -->
      <section class="card jcard">
        <div class="fav-toolbar">
          <button class="mini-btn" id="jExport" title="Ekspor jurnal ke file" data-i18n="j_export">⬇️ Export jurnal</button>
          <button class="mini-btn" id="jImport" title="Impor jurnal dari file" data-i18n="j_import">⬆️ Import jurnal</button>
          <input type="file" id="jFile" accept="application/json" hidden />
        </div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="js/errlog.js"></script>
  <script type="module" src="js/install.js"></script>
  <script type="module" src="js/journal.js"></script>
</body>
</html>
